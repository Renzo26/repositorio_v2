version: '3.9'

services:
  # ─── API .NET Core ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./portfolio-api
      dockerfile: Dockerfile
    container_name: portfolio_api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=portfolio-api
      - Jwt__Audience=portfolio-admin
      - AdminPassword=${ADMIN_PASSWORD}
      - Supabase__Url=${SUPABASE_URL}
      - Supabase__ServiceKey=${SUPABASE_SERVICE_KEY}
      - AllowedOrigins=${ALLOWED_ORIGINS}
    restart: unless-stopped

  # ─── Admin Angular ───────────────────────────────────────────────────────────
  admin:
    build:
      context: ./portfolio-admin
      dockerfile: Dockerfile
    container_name: portfolio_admin
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  # ─── Portfólio React ─────────────────────────────────────────────────────────
  portfolio:
    build:
      context: ./my-portfolio-style-guide
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_URL}
    container_name: portfolio_site
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
